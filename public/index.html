<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Setu — Apni Chhupi Hui Skills Khoje</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF6ED;
    --bg-soft: #F3ECDC;
    --ink: #2B2620;
    --ink-soft: #5B5347;
    --teal: #1B4B43;
    --teal-light: #2E6B5F;
    --marigold: #E8A33D;
    --marigold-soft: #F6D9A6;
    --rust: #B5502A;
    --card-bg: #FFFFFF;
    --border: #E3D9C2;
    --shadow: 0 2px 14px rgba(43, 38, 32, 0.08);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1A16;
      --bg-soft: #26231D;
      --ink: #F3ECDC;
      --ink-soft: #C9BFA9;
      --teal: #4A9384;
      --teal-light: #5FAE9D;
      --marigold: #F0B45C;
      --marigold-soft: #4A3B22;
      --rust: #D97650;
      --card-bg: #26231D;
      --border: #3A362C;
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C1A16;
    --bg-soft: #26231D;
    --ink: #F3ECDC;
    --ink-soft: #C9BFA9;
    --teal: #4A9384;
    --teal-light: #5FAE9D;
    --marigold: #F0B45C;
    --marigold-soft: #4A3B22;
    --rust: #D97650;
    --card-bg: #26231D;
    --border: #3A362C;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.3);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .header {
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
  }
  .header-mark {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--teal);
    flex-shrink: 0;
    position: relative;
  }
  .header-mark svg { width: 100%; height: 100%; }
  .header-text { flex: 1; min-width: 0; }
  .header-text h1 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    line-height: 1.1;
  }
  .header-text p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .lang-toggle {
    display: flex;
    flex-shrink: 0;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Work Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    cursor: pointer;
  }
  .lang-toggle button.active {
    background: var(--teal);
    color: #FBF6ED;
  }

  .divider {
    height: 6px;
    background-image: repeating-linear-gradient(45deg, var(--marigold) 0, var(--marigold) 4px, transparent 4px, transparent 8px);
    opacity: 0.55;
  }

  /* ---------- Hero illustration ---------- */
  .hero-illo-wrap {
    padding: 26px 20px 4px;
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%);
  }
  .hero-illo-wrap svg { width: 100%; max-width: 480px; height: auto; }
  .hero-thread {
    stroke-dasharray: 480;
    stroke-dashoffset: 480;
    animation: draw-thread 1.4s ease forwards 0.15s;
  }
  .hero-medallion {
    opacity: 0;
    transform-origin: center;
    animation: pop-medallion 0.5s ease forwards;
  }
  .hero-medallion:nth-of-type(1) { animation-delay: 0.5s; }
  .hero-medallion:nth-of-type(2) { animation-delay: 0.75s; }
  .hero-medallion:nth-of-type(3) { animation-delay: 1.0s; }
  .hero-medallion:nth-of-type(4) { animation-delay: 1.25s; }
  .hero-burst {
    opacity: 0;
    animation: fade-in 0.6s ease forwards 1.5s;
  }
  @keyframes draw-thread { to { stroke-dashoffset: 0; } }
  @keyframes pop-medallion { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes fade-in { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .hero-thread, .hero-medallion, .hero-burst { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
  }

  /* ---------- Intro screen ---------- */
  .intro {
    padding: 26px 24px 28px;
    text-align: left;
  }
  .intro h2 {
    font-family: 'Fraunces', serif;
    font-size: 29px;
    line-height: 1.25;
    font-weight: 600;
    margin: 0 0 14px;
    max-width: 22ch;
  }
  .intro p {
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 0 10px;
  }
  .intro-examples {
    margin: 22px 0 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    font-size: 13px;
    padding: 7px 13px;
    border-radius: 20px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--ink-soft);
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--rust);
    color: #FBF6ED;
    border: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(181, 80, 42, 0.3); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 13px 20px;
    border-radius: 10px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* ---------- Chat ---------- */
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bubble {
    max-width: 84%;
    padding: 13px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .bubble.assistant {
    background: var(--card-bg);
    border: 1px solid var(--border);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .bubble.user {
    background: var(--teal);
    color: #FBF6ED;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .chat-input-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--ink);
    max-height: 110px;
  }
  .chat-input-row textarea:focus { outline: 2px solid var(--teal-light); outline-offset: 1px; }
  .send-btn {
    background: var(--rust);
    color: #FBF6ED;
    border: none;
    border-radius: 12px;
    width: 46px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .progress-track {
    height: 4px;
    background: var(--bg-soft);
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: var(--marigold);
    transition: width 0.4s ease;
  }
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 18px 0;
    background: var(--bg);
  }
  .progress-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--teal);
    letter-spacing: 0.02em;
  }
  .intro-meta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 24px;
    margin: 0 0 22px;
  }
  .intro-meta-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--marigold);
  }

  /* ---------- Results ---------- */
  .results { padding: 26px 20px 40px; }
  .results-hero {
    text-align: left;
    margin-bottom: 26px;
  }
  .results-hero .eyebrow {
    font-size: 13px;
    color: var(--rust);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .results-hero h2 {
    font-family: 'Fraunces', serif;
    font-size: 25px;
    font-weight: 600;
    margin: 0;
    line-height: 1.3;
  }
  .flourish {
    width: 46px;
    height: 10px;
    margin-top: 14px;
  }
  .discovery-card {
    background: linear-gradient(165deg, var(--card-bg) 0%, var(--bg-soft) 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .discovery-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--teal), var(--marigold));
  }
  .discovery-step {
    margin-bottom: 14px;
  }
  .discovery-step:last-child { margin-bottom: 0; }
  .discovery-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .discovery-kicker.found { color: var(--teal); }
  .discovery-quote {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    line-height: 1.45;
    margin: 0;
    font-style: italic;
  }
  .discovery-arrow {
    text-align: center;
    color: var(--rust);
    font-size: 22px;
    line-height: 1;
    margin: 4px 0 10px;
  }
  .discovery-skill-name {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--teal);
    margin: 0 0 12px;
    line-height: 1.2;
  }
  .why-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .why-box ul {
    margin: 8px 0 0;
    padding-left: 18px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.55;
  }
  .transfer-badge {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--teal);
    background: var(--marigold-soft);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .evidence-chain {
    display: grid;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
  }
  .evidence-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    align-items: start;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .evidence-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-soft);
    color: var(--teal);
    font-weight: 700;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .evidence-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .skill-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--marigold);
  }
  .skill-card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .skill-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--marigold-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .skill-icon svg { width: 21px; height: 21px; }
  .skill-card h3 {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    margin: 0;
    font-weight: 600;
  }
  .skill-card .quote {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 14px;
  }
  .skill-card .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 14px 0 6px;
  }
  .skill-card .section-label:first-of-type { margin-top: 0; }
  .path-item {
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .path-item .link-name {
    color: var(--rust);
    font-weight: 600;
  }
  .gap-text, .cert-text {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
  }
  .cert-flag {
    display: inline-block;
    background: var(--marigold-soft);
    color: var(--rust);
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 6px;
  }

  .plan-section { margin: 30px 0; }
  .plan-section h3 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 14px;
  }
  .week-row {
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .week-row:last-child { border-bottom: none; }
  .week-num {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--teal);
    flex-shrink: 0;
    width: 62px;
  }
  .week-task { font-size: 14.5px; line-height: 1.55; }
  .week-theme {
    font-size: 12px;
    font-weight: 600;
    color: var(--rust);
    margin-top: 2px;
  }

  .section-block { margin: 28px 0; }
  .section-block h3 {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    margin: 0 0 14px;
  }
  .direction-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .direction-card h4 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin: 0 0 10px;
    color: var(--teal);
  }
  .direction-dl {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .direction-dl dt {
    font-weight: 600;
    color: var(--ink);
    margin-top: 8px;
  }
  .direction-dl dt:first-child { margin-top: 0; }
  .direction-dl dd {
    margin: 2px 0 0;
    color: var(--ink-soft);
  }
  .proof-hero {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-light) 100%);
    color: #FBF6ED;
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .proof-hero .proof-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
    margin-bottom: 8px;
  }
  .proof-hero p {
    margin: 0;
    font-size: 16px;
    line-height: 1.55;
    font-weight: 500;
  }
  .proof-hero .proof-detail {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.92;
    font-weight: 400;
  }

  .passport-card {
    background: var(--card-bg);
    border: 2px solid var(--teal);
    border-radius: 18px;
    padding: 22px 20px;
    margin: 24px 0;
    box-shadow: var(--shadow);
    position: relative;
  }
  .passport-card::after {
    content: '';
    position: absolute;
    top: 12px; right: 12px;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px dashed var(--marigold);
    opacity: 0.5;
  }
  .passport-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--teal);
  }
  .passport-sub {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .passport-body {
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .passport-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .fit-summary {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }

  .bio-box {
    background: var(--bg-soft);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 18px;
    margin: 20px 0;
    position: relative;
  }
  .bio-box h3 {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    margin: 0 0 10px;
  }
  .bio-box p {
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    margin: 0 0 12px;
  }
  .copy-btn {
    background: var(--teal);
    color: #FBF6ED;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .copy-btn.copied { background: var(--marigold); color: var(--ink); }

  .safety-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 26px;
  }

  .restart-row { margin-top: 28px; }

  .hidden { display: none !important; }

  /* ---------- Learn & Practice (results invite) ---------- */
  .practice-invite {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--teal);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin: 20px 0;
  }
  .practice-invite.done { border-left-color: var(--marigold); }
  .practice-invite .pi-kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--rust); margin-bottom: 8px;
  }
  .practice-invite h4 {
    font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 6px; color: var(--teal);
  }
  .practice-invite p { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 14px; }
  .practice-invite .pi-done-badge {
    display: inline-flex; align-items: center; gap: 6px;

  .speak-btn svg { width: 16px; height: 16px; }
  .results-listen { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; }
  .results-listen svg { width: 15px; height: 15px; }
  .results-listen.speaking { border-color: var(--teal-light); color: var(--teal); background: var(--marigold-soft); }

  /* ---------- Learn link & direction time-fit ---------- */
  .learn-link {
    display: inline-block; margin: 12px 0 0 8px; font-size: 13px; font-weight: 600;

  .direction-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }

  /* ---------- Welcome block ---------- */
  .welcome-block {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin: 0 0 22px;
    text-align: center;
    box-shadow: var(--shadow);

  .welcome-block p {

  }
  .speaker-btn { display: inline-flex; align-items: center; gap: 6px; }
  .speaker-btn.speaking { border-color: var(--teal-light); color: var(--teal); background: var(--marigold-soft); }

  /* ---------- Discovery timer ---------- */
  .timer-badge {
    display: inline-block;

    margin-top: 14px;

    font-size: 12.5px;
    color: var(--ink-soft);

  .motivation-quote {
    font-style: italic;
    font-size: 14px;

  .showcase-card {

  .app-footer {
    text-align: center;

    color: var(--rust);

    text-decoration: none;
  }
  .app-footer a:hover { text-decoration: underline; }

  @media (max-width: 420px) {
    .intro h2 { font-size: 24px; }
  }

// Calls our own backend (/api/chat), which safely holds the API key server-side.
async function callBackend(mode, prompt) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode, prompt })
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Backend error');
  return data.text;
}

/* ============ AUDIO (browser speechSynthesis) ============ */
const SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5 h3.5 L12 5.5 v13 L7.5 14.5 H4 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15.5 9 c1.3 1.6 1.3 4.4 0 6 M18.2 6.5 c2.6 3 2.6 8 0 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let speakingBtn = null;

function canSpeak() {
  return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
}

function pickVoice(lang) {
  const voices = window.speechSynthesis.getVoices();
  // Hinglish is Roman script, so an Indian-English voice is a sensible fallback
  // on devices without a Hindi voice.
  const prefs = lang === 'hi' ? ['hi-IN', 'hi', 'en-IN'] : ['en-IN', 'en-US', 'en-GB', 'en'];
  for (const p of prefs) {
    const v = voices.find(v => v.lang.replace('_', '-').toLowerCase().startsWith(p.toLowerCase()));
    if (v) return v;
  }
  return null;
}

function stopSpeaking() {
  if (canSpeak()) window.speechSynthesis.cancel();
  if (speakingBtn) speakingBtn.classList.remove('speaking');
  speakingBtn = null;
}

// Speaks text in the current UI language. Clicking the same button again stops it.
function speakText(text, btn, onEnd) {
  if (!canSpeak() || !text) return;
  const wasSame = speakingBtn === btn && window.speechSynthesis.speaking;
  stopSpeaking();
  if (wasSame) { if (onEnd) onEnd(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const voice = pickVoice(currentLang);
  u.lang = voice ? voice.lang : (currentLang === 'hi' ? 'hi-IN' : 'en-IN');
  if (voice) u.voice = voice;
  u.rate = 0.95;
  const done = () => {
    if (speakingBtn === btn) { btn.classList.remove('speaking'); speakingBtn = null; }
    if (onEnd) onEnd();
  };
  u.onend = done;
  u.onerror = done;
  speakingBtn = btn;
  btn.classList.add('speaking');
  window.speechSynthesis.speak(u);
}

function resetListenBtn() {
  const btn = document.getElementById('listenBtn');
  if (!btn) return;
  btn.hidden = !canSpeak();
  btn.innerHTML = SPEAKER_SVG + '<span>' + escapeHtml(T[currentLang].listenBtn) + '</span>';
}

function listenResults() {
  const btn = document.getElementById('listenBtn');
  const t = T[currentLang];
  const data = lastResult || {};

  }
  const willStart = !(speakingBtn === btn && window.speechSynthesis.speaking);
  speakText(parts.join(' '), btn, resetListenBtn);
  if (willStart) btn.innerHTML = SPEAKER_SVG + '<span>' + escapeHtml(t.stopBtn) + '</span>';
}

async function submitAnswer(text) {
  conversation.push({ role: 'user', content: text });
  renderChat();
  updateProgress();

  const userTurns = conversation.filter(m => m.role === 'user').length;

  if (userTurns >= 6) {
    // Real measured AI processing time only (starts when the 5th answer is submitted).
    // Shared by startChat() and startDemo(), since both flows submit through here.
    window.__discoveryStartTime = Date.now();
    showTyping();
    await generateResults();
    return;
  }

  document.getElementById('sendBtn').disabled = true;
  showTyping();
  try {
    const langLine = T[currentLang].languageInstruction;
    const fullPrompt = SYSTEM_PROMPT_BASE + '\n\n## LANGUAGE\n' + langLine + '\n\n---\n\nConversation so far:\n' + conversation.map(m => (m.role === 'assistant' ? 'You: ' : 'Her: ') + m.content).join('\n') + '\n\nShe has given ' + userTurns + ' of 6 answers so far. Now ask your next short question.';
    const text = await callBackend('chat', fullPrompt);
    hideTyping();
    conversation.push({ role: 'assistant', content: text.trim() });

    conversation.push({ role: 'assistant', content: T[currentLang].errorMsg });
    renderChat();
  }
  document.getElementById('sendBtn').disabled = false;
}

    {"week": "Week 4", "theme": "Take first step", "task": "..."}
  ],
  "showcaseSteps": {
    "video": "One sentence: what kind of short video she could record of her work (specific to her top skill)",
    "platform": "Where to post it (Instagram Reels / WhatsApp Status — generic, don't invent new platforms)",
    "encouragement": "One warm, honest encouraging sentence — NO income figures, NO guarantees, just genuine encouragement based on her existing evidence"
  },
  "passportNextStep": "One sentence — the very next thing to do after today",
  "uncertaintyNote": "optional — if evidence was limited"
}`;

  try {
    const rawText = await callBackend('extract', extractionPrompt);
    hideTyping();
    const cleaned = rawText.trim().replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '');
    const result = JSON.parse(cleaned);
    lastResult = result;
    const elapsedMs = Date.now() - (window.__discoveryStartTime || Date.now());
    const elapsedSec = Math.round(elapsedMs / 1000);
    window.__lastElapsedSec = elapsedSec;
    renderResults(result);
  } catch (err) {
    hideTyping();
    document.getElementById('screen-chat').classList.remove('hidden');
    conversation.push({ role: 'assistant', content: T[currentLang].reportErrorMsg });
    renderChat();
  }
  document.getElementById('sendBtn').disabled = false;
}

function getSkillIcon(name) {
  const n = (name || '').toLowerCase();
  let key = 'spark';
  if (/bak|food|culinary|cook|tiffin/.test(n)) key = 'food';
  else if (/tailor|embroid|mehendi|craft|stitch/.test(n)) key = 'needle';
  else if (/budget|money|bookkeep|account|finance/.test(n)) key = 'money';
  else if (/tutor|academic|english|language|literacy/.test(n)) key = 'book';
  else if (/coach|music|dance|yoga|art/.test(n)) key = 'music';
  else if (/event|function|organis|schedul|operation/.test(n)) key = 'calendar';
  else if (/customer|communicat/.test(n)) key = 'chat';
  else if (/sales|resell|negotiat/.test(n)) key = 'tag';
  else if (/beauty|groom/.test(n)) key = 'sparkle';
  else if (/child|elder|care/.test(n)) key = 'heart';
  else if (/social media|digital content/.test(n)) key = 'phone';
  else if (/ai|digital|comput|data/.test(n)) key = 'chip';
  return `<svg viewBox="0 0 24 24" fill="none" style="color:var(--teal)">${SKILL_ICONS[key]}</svg>`;
}

// Time-fit badge text for a direction, e.g. "10-12 hrs/week · Local".
function directionFitText(d) {
  return [d.hoursPerWeek, d.mode].map(s => (s || '').trim()).filter(Boolean).join(' · ');
}

// Curated learning link per skill; everything else falls back to a YouTube search.
function getLearnUrl(name) {
  const n = (name || '').toLowerCase();
  if (/culinary|food prep/.test(n)) return 'https://www.youtube.com/@NishaMadhulika';
  if (/tailor/.test(n)) return 'https://www.youtube.com/results?search_query=' + encodeURIComponent('Tailoring in Hindi') + '&sp=EgIQAg%3D%3D';
  if (/self-taught|ai upskill/.test(n)) return 'https://academy.openai.com';
  const suffix = currentLang === 'hi' ? ' tutorial hindi' : ' tutorial for beginners';
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent((name || '') + suffix);
}

function evidenceRow(num, label, text) {
  if (!text) return '';

// includeResources: true for copy/share text; the on-screen passport shows
// resources in their own #passportResources section instead.
function buildPassportText(data, includeResources) {
  const t = T[currentLang];
  const lines = ['=== ' + t.passportTitle + ' ===', ''];
  if (data.fitSummary) lines.push(t.fitTitle + ': ' + data.fitSummary, '');
  (data.skills || []).forEach((s, i) => {
    lines.push((i + 1) + '. ' + (s.name || ''));
    if (s.userQuote || s.quote) lines.push('   "' + (s.userQuote || s.quote) + '"');
    (s.whyReasons || []).forEach(w => lines.push('   • ' + w));
    lines.push('');
  });
  (data.directions || []).slice(0, 3).forEach(d => {
    const fit = directionFitText(d);
    lines.push('→ ' + (d.title || '') + (fit ? ' (' + fit + ')' : ''));
    lines.push('  ' + t.dirStep + ': ' + (d.firstStep || ''));
    if (d.platforms) lines.push('  ' + t.dirPlatforms + ': ' + d.platforms);
  });
  lines.push('');
  const p = data.firstProofOfWork || {};
  if (p.title) lines.push(t.proofKicker + ': ' + p.title, p.description || '', '');
  if (practiceEvidence) {
    lines.push(t.practice.passportLabel + ': ' + practiceEvidence.detail + ' (' + t.practice.passportTag + ')', '');
  }
  const showcase = showcaseItems(data);
  if (showcase.length) {
    lines.push(t.showcaseTitle + ':');
    showcase.forEach((s, i) => lines.push('  ' + (i + 1) + '. ' + s));
    lines.push('');
  }
  if (data.passportNextStep) lines.push('Next: ' + data.passportNextStep);
  if (includeResources) {
    lines.push('', t.resourcesLabel + ':');
    t.resources.forEach(r => lines.push('• ' + r.name + ' (' + r.host + ') — ' + r.desc));
  }
  return lines.join('\n').trim();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function getPassportText() {
  return buildPassportText(lastResult || {}, true);
}

function copyPassport() {
  const text = getPassportText();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const tr = T[currentLang];
    btn.textContent = tr.copiedBtn;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = tr.copyBtn; btn.classList.remove('copied'); }, 2000);
  }).catch(() => {});
}

async function sharePassport() {
  const text = getPassportText();
  const tr = T[currentLang];
  const title = tr.passportTitle;
  try {
    if (navigator.share) {
      await navigator.share({ title, text });
      const btn = document.getElementById('shareBtn');
      btn.textContent = tr.sharedBtn;
      setTimeout(() => { btn.textContent = tr.shareBtn; }, 2000);
    } else {
      copyPassport();
    }
  } catch (_) { /* user cancelled share */ }
}

      '<h4>' + escapeHtml(mod.title[currentLang]) + '</h4>' +
      '<p>' + escapeHtml(p.doneDesc) + '</p>' +
      '<button class="btn-ghost" onclick="openPractice(\'google_sheets\')" data-testid="practice-review-btn">' + escapeHtml(p.reviewBtn) + '</button>';
  } else {
    el.className = 'practice-invite';
    el.innerHTML =
      '<div class="pi-kicker">' + escapeHtml(p.inviteKicker) + '</div>' +
      '<h4>' + escapeHtml(mod.title[currentLang]) + '</h4>' +
      '<p>' + escapeHtml(p.inviteDesc) + '</p>' +
      '<button class="btn-primary" onclick="openPractice(\'google_sheets\')" data-testid="start-practice-btn">' + escapeHtml(p.inviteBtn) + '</button>';
  }
}

function buildSheet(mod, lang) {
  let html = '<div class="sheet" role="table">';
  html += '<div class="sheet-row"><div class="sheet-cell sheet-corner"></div>' +
    mod.columns.map(c => '<div class="sheet-cell sheet-colhead">' + c + '</div>').join('') + '</div>';
  html += '<div class="sheet-row"><div class="sheet-cell sheet-rowhead">1</div>' +
    mod.headerRow[lang].map(h => '<div class="sheet-cell sheet-data">' + escapeHtml(h) + '</div>').join('') + '</div>';
  mod.rows.forEach((r, i) => {
    html += '<div class="sheet-row"><div class="sheet-cell sheet-rowhead">' + (i + 2) + '</div>' +
      r.map((cell, ci) => {
        const hl = (ci + 1) === mod.highlightCol ? ' sheet-highlight' : '';
        return '<div class="sheet-cell sheet-data' + hl + '">' + escapeHtml(cell) + '</div>';
      }).join('') + '</div>';
  });
  html += '</div>';
  return html;
}

function openPractice(moduleId) {
  currentModuleId = moduleId;
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-practice').classList.remove('hidden');
  window.scrollTo(0, 0);
  renderPracticeScreen();
}

function closePractice() {
  document.getElementById('screen-practice').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');
}

function renderPracticeScreen() {
  const mod = PRACTICE_MODULES[currentModuleId];
  const p = T[currentLang].practice;
  const lang = currentLang;
  document.getElementById('practiceBackBtn').textContent = p.back;
  document.getElementById('practiceKicker').textContent = p.kicker;
  document.getElementById('practiceTitle').textContent = mod.title[lang];
  document.getElementById('practiceSub').textContent = mod.sub[lang];
  document.getElementById('conceptStepLabel').textContent = p.conceptStep;
  document.getElementById('conceptTitle').textContent = mod.conceptTitle[lang];
  document.getElementById('conceptBody').innerHTML = '<ul>' + mod.concept[lang].map(c => '<li>' + c + '</li>').join('') + '</ul>';
  document.getElementById('startExerciseBtn').textContent = p.startExercise;
  document.getElementById('exerciseStepLabel').textContent = p.exerciseStep;
  document.getElementById('exerciseQuestion').textContent = mod.question[lang];
  document.getElementById('exerciseTable').innerHTML = buildSheet(mod, lang);
  document.getElementById('formulaInput').placeholder = mod.placeholder;
  document.getElementById('checkAnswerBtn').textContent = p.check;
  document.getElementById('completeTitle').textContent = p.completeTitle;
  document.getElementById('completeDesc').textContent = p.completeDesc;
  document.getElementById('saveEvidenceBtn').textContent = p.save;

  // Reset to step 1
  document.getElementById('practiceConcept').classList.remove('hidden');
  document.getElementById('practiceExercise').classList.add('hidden');
  document.getElementById('practiceComplete').classList.add('hidden');
  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('practiceActions').innerHTML = '';
  document.getElementById('formulaInput').value = '';
}

function startExercise() {
  document.getElementById('practiceConcept').classList.add('hidden');
  document.getElementById('practiceExercise').classList.remove('hidden');
  document.getElementById('formulaInput').focus();
}

function handlePracticeKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
}

function checkAnswer() {
  const mod = PRACTICE_MODULES[currentModuleId];
  const p = T[currentLang].practice;
  const inp = document.getElementById('formulaInput');
  const fb = document.getElementById('feedbackArea');
  const actions = document.getElementById('practiceActions');
  if (!inp.value.trim()) { inp.focus(); return; }
  if (mod.validate(inp.value)) {
    fb.innerHTML = '<div class="feedback correct" data-testid="feedback-correct"><span class="fb-title">' + escapeHtml(mod.correct[currentLang]) + '</span></div>';
    actions.innerHTML = '';
    const complete = document.getElementById('practiceComplete');
    complete.classList.remove('hidden');
    window.scrollTo({ top: complete.offsetTop - 30, behavior: 'smooth' });
  } else {
    fb.innerHTML = '<div class="feedback incorrect" data-testid="feedback-incorrect">' + escapeHtml(mod.incorrect[currentLang]) + '</div>';
    actions.innerHTML =
      '<button class="btn-ghost" onclick="tryAgain()" data-testid="try-again-btn">' + escapeHtml(p.tryAgain) + '</button>' +
      '<button class="btn-ghost" onclick="showHint()" data-testid="hint-btn">' + escapeHtml(p.hint) + '</button>' +
      '<button class="btn-ghost" onclick="showExample()" data-testid="show-example-btn">' + escapeHtml(p.example) + '</button>';
  }
}

function tryAgain() {
  document.getElementById('feedbackArea').innerHTML = '';
  document.getElementById('practiceActions').innerHTML = '';
  const inp = document.getElementById('formulaInput');
  inp.value = '';
  inp.focus();
}

function showHint() {
  const mod = PRACTICE_MODULES[currentModuleId];
  const p = T[currentLang].practice;
  document.getElementById('feedbackArea').innerHTML =
    '<div class="feedback incorrect" data-testid="feedback-hint"><span class="fb-title">' + escapeHtml(p.hint) + '</span>' + escapeHtml(mod.hint[currentLang]) + '</div>';
}

function showExample() {
  const mod = PRACTICE_MODULES[currentModuleId];
  const p = T[currentLang].practice;
  document.getElementById('feedbackArea').innerHTML =
    '<div class="feedback incorrect" data-testid="feedback-example"><span class="fb-title">' + escapeHtml(p.exampleTitle) + '</span>' + mod.example[currentLang] + '</div>';
}

function completePractice() {
  const mod = PRACTICE_MODULES[currentModuleId];
  practiceEvidence = { skill: mod.title[currentLang], detail: mod.evidence[currentLang], moduleId: mod.id };
  updatePassportEvidence();
  renderPracticeInvite();
  document.getElementById('passportBody').textContent = buildPassportText(lastResult || {});
  closePractice();
  const pc = document.getElementById('passportCard');
  window.scrollTo({ top: pc.offsetTop - 30, behavior: 'smooth' });
}

function updatePassportEvidence() {
  const el = document.getElementById('passportEvidence');
  if (!el) return;
  if (!practiceEvidence) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  const p = T[currentLang].practice;
  el.classList.remove('hidden');
  el.innerHTML =
    '<span class="pe-label">' + escapeHtml(p.passportLabel) + '</span>' +
    '<div class="pe-item">' + escapeHtml(practiceEvidence.detail) + '</div>' +
    '<div class="pe-tag">' + escapeHtml(p.passportTag) + '</div>';
}

/* Init */
applyTranslations();
</script>
</body>
</html>
